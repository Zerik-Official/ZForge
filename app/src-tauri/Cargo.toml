[package]
name = "zforge"
version = "0.1.0"
description = "Modern desktop launcher for World of Warcraft 3.3.5a"
authors = ["Zerik-Official"]
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "zforge_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
cpal = "0.18.2"
log = "0.4"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-log = "2"
tauri-plugin-opener = "2.7.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "sync", "time"] }
tracing = { version = "0.1", features = ["log"] }
uuid = { version = "1.29.2", features = ["v4"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dev-dependencies]
tempfile = "3.27.0"

# Debug builds: keep line info for our crate only; full debug info for every
# dependency is what makes `target/` grow to several gigabytes.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Release builds: small, optimized executable.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
